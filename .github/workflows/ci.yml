name: CI Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Lint, Test & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run go fmt & go vet (Static Analysis)
        run: |
          if [ -n "$(go fmt ./...)" ]; then
            echo "Code is not formatted with 'go fmt'"
            exit 1
          fi
          go vet ./...

      - name: Run Tests with Race Detector & Coverage
        run: |
          go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Check Code Coverage Threshold
        run: |
          # Contoh opsional: Memastikan coverage minimal terpenuhi (misal: 60%)
          go tool cover -func=coverage.out
